name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test --if-present

      - name: Build Docker image
        run: docker build -t express-hello-world:ci .

      - name: Notify success
        if: success()
        run: echo "::notice::Pipeline completed successfully."

      - name: Notify failure
        if: failure()
        run: echo "::error::Pipeline failed. Please check logs for details."
