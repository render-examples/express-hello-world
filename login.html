<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · NEXORA AI</title><link rel="stylesheet" href="styles.css">
<style>
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#eeeaff,transparent 35%),#f7f7fb}
.auth-card{width:min(430px,100%);background:#fff;border:1px solid #ececf3;border-radius:16px;padding:30px;box-shadow:0 15px 50px #28205a0d}
.auth-brand{display:flex;align-items:center;gap:10px;font:800 18px Manrope;margin-bottom:30px}.auth-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,#8978ff,#5746d9);color:white;display:grid;place-items:center}
.auth-card h1{font-size:24px}.auth-card p{color:#77788d;font-size:12px;line-height:1.6}.auth-card label{display:grid;gap:7px;font-size:11px;font-weight:700;margin:14px 0}.auth-card input{border:1px solid #ececf3;border-radius:8px;padding:12px;font-size:12px}.auth-card button{width:100%;margin-top:8px}.auth-switch{text-align:center;margin-top:17px!important}.auth-switch button{width:auto;border:0;background:none;color:#7666ef;font-weight:700}.auth-error{color:#c34d4d!important;min-height:18px}.auth-note{font-size:10px!important;background:#f7f6ff;padding:10px;border-radius:8px}
</style></head><body><main class="auth-wrap"><section class="auth-card">
<a class="auth-brand" href="/"><span class="auth-mark">N</span>NEXORA <span style="color:#7666ef">AI</span></a>
<h1 id="formTitle">Welcome back</h1><p id="formSubtitle">Sign in to continue to your business workspace.</p>
<form id="authForm"><label>Email address<input id="email" type="email" required placeholder="you@company.com" autocomplete="email"></label>
<label>Password<input id="password" type="password" required minlength="8" placeholder="At least 8 characters" autocomplete="current-password"></label>
<button class="primary-btn" id="submitBtn">Sign in</button></form>
<p class="auth-error" id="authError" role="alert"></p>
<p class="auth-switch" id="switchText">New to NEXORA? <button id="switchMode" type="button">Create an account</button></p>
<p class="auth-note">Account access requires your Supabase project configuration. Signup confirmation may require verifying your email.</p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></body></html>
